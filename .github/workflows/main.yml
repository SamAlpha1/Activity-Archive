name: Archive Integrity

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate archive inputs
        shell: bash
        run: |
          set -euo pipefail
          for file in commit-log.txt stickers.txt; do
            test -s "$file" || { echo "$file is missing or empty"; exit 1; }
            if ! tail -c 1 "$file" | od -An -t x1 | grep -q '0a'; then
              echo "$file must end with a newline"
              exit 1
            fi
          done
          if grep -n $'\r' commit-log.txt stickers.txt; then
            echo "Unexpected CR characters found"
            exit 1
          fi
          printf 'Archive integrity OK: %s log lines, %s sticker lines\n' \
            "$(wc -l < commit-log.txt)" "$(wc -l < stickers.txt)"
